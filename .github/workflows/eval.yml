name: Eval

# Asks every eval case of every model against the live knowledge file. Weekly rather than on every
# push, so it stays inside the free tiers (OpenRouter allows 50 free requests a day). The run uses
# the same daily quotas as visitors, so it goes on Sunday, the quietest day, at 21:00 UTC: three
# hours before OpenRouter's and Workers AI's daily quotas reset at midnight UTC, so it spends what
# the day left over instead of what visitors need next. Gemini resets at midnight Pacific time
# (08:00 UTC) and cannot be lined up too.
on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

# Writes the results to evals/history.json on main and redeploys the Worker, which serves them
# at GET /evals for the portfolio's /assistant page. A push with GITHUB_TOKEN starts no other
# workflow, so the deploy happens here.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write provider keys
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          {
            echo "GROQ_API_KEY=$GROQ_API_KEY"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY"
          } > .dev.vars
      - run: pnpm eval --record evals/history.json
        env:
          # Workers AI runs through Wrangler's remote binding.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Also after a failed quality gate: a bad week belongs in the history too.
      - name: Publish the results
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git diff --quiet evals/history.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record the eval results" evals/history.json
          git pull --rebase
          git push
          pnpm run deploy
